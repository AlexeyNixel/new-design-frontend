name: CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - 'reports/**'
      - '**.md'
      - '.claude/**'

jobs:
  deploy:
    name: Lint → Deploy (Dokploy)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      # Сборку Docker-образа и запуск контейнера делает Dokploy (по Dockerfile из репозитория).
      # Доступ к Dokploy лежит на сервере раннера, а не в секретах GitHub:
      #   ~/.config/dokploy/frontend.env — DOKPLOY_URL, DOKPLOY_TOKEN, DOKPLOY_APP_ID (chmod 600)
      - name: Deploy via Dokploy
        run: |
          set -euo pipefail
          source "$HOME/.config/dokploy/frontend.env"
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\": \"$DOKPLOY_APP_ID\"}"
          echo "Деплой запущен — ход сборки и логи в Dokploy"
