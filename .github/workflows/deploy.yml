name: CI/CD

on:
  push:
    branches: [master]
    paths-ignore:
      - 'reports/**'
      - '**.md'
      - '.claude/**'

jobs:
  deploy:
    name: Lint → Build → Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}

      - name: Deploy to production
        run: |
          rm -rf /var/www/frontend/.output
          cp -r .output /var/www/frontend/.output
          pm2 restart frontend-v2