name: CI

# Деплой делает Dokploy сам: GitHub App «Dokploy-NOMB» сообщает о push в master,
# Dokploy забирает код, собирает образ по Dockerfile и перезапускает контейнер.
# Этот workflow только проверяет код линтером — статус виден в GitHub у коммита/PR.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'reports/**'
      - '**.md'
      - '.claude/**'
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        # --ignore-scripts: для линта postinstall (nuxt prepare) не нужен
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npx eslint .
